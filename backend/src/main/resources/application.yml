spring:
  application:
    name: thali
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/thali}
    username: ${DB_USER:thali}
    password: ${DB_PASS:thali}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway
  flyway:
    enabled: true

server:
  port: ${PORT:8081}   # 8081 because 8080 is often taken by other local Java apps

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  zone: Asia/Kolkata
  billing:
    fixed-monthly-charge: 300.00
    due-days: 15
    auto-generate: true   # on the 1st of each month at 02:00 campus time
  seed:
    enabled: false
    demo-password: ${DEMO_PASSWORD:Demo@1234}
  scheduling:
    enabled: true
  attendance:
    enforce-window: true
    early-minutes: 30
    late-minutes: 30
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  auth:
    allowed-domain: iiit-bh.ac.in
    student-local-part-regex: "[a-z]\\d{6}"   # e.g. b423046
    otp-ttl-minutes: 5
    otp-max-attempts: 5
    otp-resend-cooldown-seconds: 60
    otp-max-per-hour: 5
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}   # >= 32 bytes; ALWAYS override in production
    access-ttl-minutes: 15
    refresh-ttl-days: 7
    registration-ttl-minutes: 15
  mail:
    brevo-api-key: ${BREVO_API_KEY:}
    from-email: ${MAIL_FROM:}
    from-name: Thali Mess
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
